{% extends "wedding_rsvp/base.html" %} {%load static %} {% block content %}
<div class="dim-background"></div>

<section class="rsvp-wrapper" id="rsvp-wrapper-id">
  <div class="rsvp-box">
    <img
      src="{% static 'wedding_rsvp/images/logo_sage.png' %}"
      alt="Wedding Logo"
      class="login-logo"
    />
    <h2 class="rsvp-confirm">RSVP</h2>
    <div class="rsvp-info">
      <p>
        Thank you for submitting your RSVP! Sad to miss you at the wedding, but
        we’ll raise a glass in your honor!
      </p>
    </div>
  </div>
</section>

{% endblock %}
